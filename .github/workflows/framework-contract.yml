name: framework-contract

on:
  push:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "benchmarking-utilities/**"
      - "frameworks/**"
      - "manifests/**"
      - "schemas/**"
      - "tools/validate_framework_contract.py"
      - "tools/validate_project_inventory.py"
      - "tools/validate_json_schemas.py"
      - "tools/ci_framework_image.py"
      - ".github/workflows/framework-contract.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "benchmarking-utilities/**"
      - "frameworks/**"
      - "manifests/**"
      - "schemas/**"
      - "tools/validate_framework_contract.py"
      - "tools/validate_project_inventory.py"
      - "tools/validate_json_schemas.py"
      - "tools/ci_framework_image.py"
      - ".github/workflows/framework-contract.yml"

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Validate all JSON documents against their schemas
        run: python tools/validate_json_schemas.py
      - name: Validate framework catalog and packaging contract
        run: python tools/validate_framework_contract.py
      - name: Validate matrix, catalog, and manifest inventory
        run: python tools/validate_project_inventory.py

  lightweight-images:
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - openssl-aes128-cbc-c
          - tinyaes-aes128-cbc-c
          - hheland-rubato128l-go
          - hheland-symmetric-go
          - transistor-symmetric-python
          - elisabeth-clear-rust
          - margrethe-ske-python
          - fasta-symmetric-c
          - hhe-framework-plain-cpp
          - yux-symmetric-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Build image and validate bounded smoke through JSONL report
        run: python tools/ci_framework_image.py "${{ matrix.image }}" --smoke --output-dir "ci-results/${{ matrix.image }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.image }}
          path: ci-results/${{ matrix.image }}/
          if-no-files-found: ignore
