[package]
name = "elisabeth"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hhe-benchmark = { path = "../../benchmarking-utilities/rust" }
concrete-commons = "0.1.0"
concrete-core = "=0.1.9"
# for benchmark utils
serde = "1.0.130"
bincode = "1.3.3"

rayon = {version = "1.5.1", optional = true}

[[test]]
name = "clear"
harness = false

[[test]]
name = "homomorphic"
harness = false

[[bench]]
name = "benchmark-elisabeth"
harness = false

[[bin]]
name = "hhe-arena-clear"
path = "tests/clear.rs"

[profile.bench]
opt-level = 3
debug = true
lto = "fat"

[features]
default = ["multithread"]
single_key = []
multithread = ["rayon"]
