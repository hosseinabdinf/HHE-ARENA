[package]
name = "frast"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hhe-benchmark = { path = "../../../benchmarking-utilities/rust" }
tfhe = { version = "0.4.1", features = ["boolean", "shortint", "x86_64-unix"] }
aligned-vec = { version = "0.5.0" }
dyn-stack = { version = "0.9" }
rand = "0.8.5"
serde = { version = "*" }
bincode = "1.3.3"
sha3 = "0.10.8"
rayon = { version = "*", optional = true }
pulp = "0.18.8"

[dev-dependencies]
criterion = { path = "../../../benchmarking-utilities/rust-criterion-compat", features = ["html_reports"] }

[[test]]
name = "frast"
harness = false

[[test]]
name = "negacyclic_dbr"
harness = false

[[bench]]
name = "bench_gen_pbs"
harness = false

[[bench]]
name = "bench_frast"
harness = false

[[bench]]
name = "bench_setup"
harness = false

[[bench]]
name = "bench_online"
harness = false

[features]
default = ["monothread"]
monothread = []
multithread = ["rayon"]
