[package]
name = "tfhe-trivium"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hhe-benchmark = { path = "../../../../benchmarking-utilities/rust" }
rayon = { workspace = true }
tfhe = { path = "../../tfhe", features = [ "boolean", "shortint", "integer" ] }

# for benchmark utils
[dev-dependencies]
criterion = { path = "../../../../benchmarking-utilities/rust-criterion-compat", features = [ "html_reports" ]}

[[bench]]
name = "trivium"
harness = false

